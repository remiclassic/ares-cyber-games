<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breach Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" />
  </head>
  <body>
    <a class="skip-link" href="#board">Skip to the timeline</a>
    <div id="app">
      <section id="game" class="screen" aria-label="Breach Timeline practice">
        <header class="top">
          <div class="brand">
            <span id="logo"></span>
            <div><strong>Project Ares</strong><span>People<br />Practice<br />Stronger defenses</span></div>
          </div>
          <div class="title">
            <p><b>Project Ares</b> / Training minigame</p>
            <h1>Breach Timeline</h1>
            <p class="sub">Put it in order. Stop it first.</p>
          </div>
          <div class="status" id="status"></div>
        </header>
        <main class="cols two">
          <aside class="col" id="case" aria-label="Incident file"></aside>
          <section class="col" aria-label="Timeline"><div class="col-head" id="board-head"></div><div id="next-step" class="next-bar" aria-live="polite"></div><div class="d-scroll board-body" id="board"></div></section>
        </main>
        <p class="fineprint">Fictionalised incidents · Prototype · Content to be reviewed with SMEs</p>
      </section>
      <section id="debrief" class="screen" hidden aria-labelledby="debrief-title"></section>
    </div>
    <div id="toasts" aria-hidden="true"></div>
    <div id="modal-root"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/timeline/main.ts"></script>
  </body>
</html>
