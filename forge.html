<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
  </head>
  <body>
    <a class="skip-link" href="#bench">Skip to the forge</a>
    <div id="app">
      <section id="game" class="screen" aria-label="Password Forge practice">
        <header class="top">
          <div class="brand">
            <span id="logo"></span>
            <div><strong>Project Ares</strong><span>People<br />Practice<br />Stronger defenses</span></div>
          </div>
          <div class="title">
            <p><b>Project Ares</b> / Training minigame</p>
            <h1>Password Forge</h1>
            <p class="sub">Length and surprise beat symbols</p>
          </div>
          <div class="status" id="status"></div>
        </header>
        <main class="cols two">
          <aside class="col" id="plan" aria-label="Forge challenges"></aside>
          <section class="col" aria-label="The forge"><div class="col-head" id="bench-head"></div><div id="next-step" class="next-bar" aria-live="polite"></div><div class="d-scroll bench-body" id="bench"></div></section>
        </main>
        <p class="fineprint">5-minute practice loop · Prototype · Fictional · Content to be reviewed with SMEs · Nothing you type is sent or saved</p>
      </section>
      <section id="debrief" class="screen" hidden aria-labelledby="debrief-title"></section>
    </div>
    <div id="toasts" aria-hidden="true"></div>
    <div id="modal-root"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/forge/main.ts"></script>
  </body>
</html>
