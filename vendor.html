<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendor Vetting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" />
  </head>
  <body>
    <a class="skip-link" href="#file">Skip to the supplier file</a>
    <div id="app">
      <section id="game" class="screen" aria-label="Vendor Vetting practice">
        <header class="top">
          <div class="brand">
            <span id="logo"></span>
            <div><strong>Project Ares</strong><span>People<br />Practice<br />Stronger defenses</span></div>
          </div>
          <div class="title">
            <p><b>Project Ares</b> / Training minigame</p>
            <h1>Vendor Vetting</h1>
            <p class="sub">Read the file. Match the risk. Sign.</p>
          </div>
          <div class="status" id="status"></div>
        </header>
        <main class="cols vendor-cols" id="cols">
          <aside class="col" id="brief" aria-label="Purchase brief and bids"></aside>
          <section class="col" id="file" aria-label="Supplier file">
            <div class="col-head" id="file-head"></div>
            <div id="next-step" class="next-bar" aria-live="polite"></div>
            <div class="d-scroll" id="file-view"></div>
          </section>
          <aside class="col" id="decide" aria-label="Verdict"></aside>
        </main>
        <p class="fineprint">8-minute practice loop · Prototype · Fictional company and suppliers · Content to be reviewed with SMEs</p>
      </section>
      <section id="debrief" class="screen" hidden aria-labelledby="debrief-title"></section>
    </div>
    <div id="toasts" aria-hidden="true"></div>
    <div id="modal-root"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/vendor/main.ts"></script>
  </body>
</html>
